# Backing services for the integration tests: `npm run test:integration`.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: test
    ports:
      - "55432:5432"
  azurite: # host port 55100: avoids the crowded 10000 range other local stacks use
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck
    ports:
      - "55100:10000"
