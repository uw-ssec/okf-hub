name: container-image

on:
  push:
    branches: [container]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -p .
      - run: npx vitest run
      - name: Start the integration services
        run: |
          docker compose -f compose.test.yml up -d
          for _ in $(seq 60); do
            docker compose -f compose.test.yml exec -T postgres pg_isready -U postgres \
              && (exec 3<>/dev/tcp/127.0.0.1/55100) 2>/dev/null && exit 0
            sleep 1
          done
          echo "integration services did not become ready"
          exit 1
      - run: npm run test:integration
      - name: Stop the integration services
        if: always()
        run: docker compose -f compose.test.yml down -v
      - name: End to end against the built image
        run: |
          docker compose -f compose.yml up -d --build
          bash test/container-oidc.sh
      - name: Show hub logs on failure
        if: failure()
        run: docker compose -f compose.yml logs
      - name: Stop the end-to-end stack
        if: always()
        run: docker compose -f compose.yml down -v

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compute the tag
        run: echo "TAG=container-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/uw-ssec/okf-hub:${{ env.TAG }}
